# One workflow for both events on purpose. Code scanning derives an analysis's
# key from the workflow file path plus job name, so a PR scanned by test_pr.yml
# and master scanned by test_push.yml were two configurations that could never
# match, and every PR reported "1 configuration not found" instead of a diff.
# Splitting these back into separate files brings that back.
name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
      id: go

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.12.2
        only-new-issues: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
      id: go

    - name: Test
      run: go test -coverprofile cover.out ./...

  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
      id: go

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        version: '~> v2'
        args: release --clean --snapshot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # GoReleaser --snapshot builds per-arch images (no :latest manifest, which
    # only exists after a push), so scan the amd64 image it just built.
    - name: Tag built image for scanning
      run: |
        image="$(docker images --filter=reference='ghcr.io/hackthebox/php-fpm_exporter:*-amd64' --format '{{.Repository}}:{{.Tag}}' | head -n1)"
        docker tag "$image" localbuild/php-fpm_exporter:scan

    - name: Scan image
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      id: scan
      with:
        image: "localbuild/php-fpm_exporter:scan"
        acs-report-enable: true
        fail-build: false

    - name: Upload Anchore scan SARIF report
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: image-scan