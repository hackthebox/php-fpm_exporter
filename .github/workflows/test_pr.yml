name: Test PR
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
      id: go

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.12.2
        only-new-issues: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
      id: go

    - name: Test
      run: go test -coverprofile cover.out ./...

  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
      id: go

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: '~> v2'
        args: release --clean --snapshot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # GoReleaser --snapshot builds per-arch images (no :latest manifest, which
    # only exists after a push), so scan the amd64 image it just built.
    - name: Tag built image for scanning
      run: |
        image="$(docker images --filter=reference='ghcr.io/hackthebox/php-fpm_exporter:*-amd64' --format '{{.Repository}}:{{.Tag}}' | head -n1)"
        docker tag "$image" localbuild/php-fpm_exporter:scan

    - name: Scan image
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      id: scan
      with:
        image: "localbuild/php-fpm_exporter:scan"
        acs-report-enable: true
        fail-build: false

    # Without an explicit category, code scanning keys the analysis on the
    # workflow file and job name. A PR would then upload under test_pr.yml while
    # master sits under test_push.yml, so the two never match and every PR gets
    # "1 configuration not found" instead of a diff. Keep this value identical in
    # test_push.yml.
    - name: Upload Anchore scan SARIF report
      uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: image-scan